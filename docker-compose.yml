    services:
        mosquitto:
            image: eclipse-mosquitto:2
            container_name: monitoring_mosquitto
            restart: unless-stopped
            ports:
                - "1883:1883"
            volumes:
                - ./docker/mosquitto/config:/mosquitto/config
                - ./docker/mosquitto/data:/mosquitto/data
                - ./docker/mosquitto/log:/mosquitto/log
            networks:
                - laravel

        app:
            build:
                context: ./docker/php
                dockerfile: Dockerfile
            image: laravel-custom-app
            container_name: monitoring_app
            restart: unless-stopped
            working_dir: /var/www/html
            volumes:
                - ./:/var/www/html
            extra_hosts:
                - "host.docker.internal:host-gateway"
            environment:
                - APP_ENV=production
                - APP_DEBUG=false
                - DB_CONNECTION=mysql
                - DB_HOST=mysql
                - DB_PORT=3306
                - DB_DATABASE=wijayapl_monitoring
                - DB_USERNAME=wijayapl_monitoring
                - DB_PASSWORD=monitoring_wijaya21
                - MQTT_HOST=host.docker.internal
                - MQTT_PORT=1883
                - MQTT_USERNAME=dashboard_user
                - MQTT_PASSWORD=PasswordDashboardYangKuat
            networks:
                - laravel
            depends_on:
                - mysql

        # Worker otomatis untuk MQTT Listener
        mqtt-worker:
            build:
                context: ./docker/php
                dockerfile: Dockerfile
            image: laravel-custom-app
            container_name: monitoring_mqtt_worker
            restart: unless-stopped
            working_dir: /var/www/html
            volumes:
                - ./:/var/www/html
            command: php artisan mqtt:subscribe
            networks:
                - laravel
            extra_hosts:
                - "host.docker.internal:host-gateway"
            environment:
                - MQTT_HOST=host.docker.internal
                - MQTT_PORT=1883
                - MQTT_USERNAME=dashboard_user
                - MQTT_PASSWORD=PasswordDashboardYangKuat
                - MQTT_ENABLE_LOGGING=false
            depends_on:
                - app
                - mysql

        # Web Server Nginx (Opsional jika ingin langsung mirip produksi)
        # Atau Anda bisa menggunakan built-in server PHP untuk local: php artisan serve
        nginx:
            image: nginx:alpine
            container_name: monitoring_nginx
            restart: unless-stopped
            ports:
                - "80:80"
                - "443:443"
            extra_hosts:
                - "host.docker.internal:host-gateway"
            volumes:
                - ./:/var/www/html
                - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
                - /etc/letsencrypt:/etc/letsencrypt:ro
            networks:
                - laravel
            depends_on:
                - app

        mysql:
            image: mariadb:latest
            container_name: monitoring_db
            restart: unless-stopped
            environment:
                MARIADB_DATABASE: wijayapl_monitoring
                MARIADB_ROOT_PASSWORD: monitoring_wijaya21
                MARIADB_USER: wijayapl_monitoring
                MARIADB_PASSWORD: monitoring_wijaya21
            ports:
                - "3306:3306"
            volumes:
                - mysql_data:/var/lib/mysql
            networks:
                - laravel

        scheduler:
            build:
                context: ./docker/php
                dockerfile: Dockerfile
            image: laravel-custom-app
            container_name: monitoring_scheduler
            restart: unless-stopped
            working_dir: /var/www/html
            volumes:
                - ./:/var/www/html
            command: php artisan schedule:work
            networks:
                - laravel
            extra_hosts:
                - "host.docker.internal:host-gateway"
            environment:
                - TZ=Asia/Jakarta
                - APP_ENV=production
                - APP_DEBUG=false
                - DB_CONNECTION=mysql
                - DB_HOST=mysql
                - DB_PORT=3306
                - DB_DATABASE=wijayapl_monitoring
                - DB_USERNAME=wijayapl_monitoring
                - DB_PASSWORD=monitoring_wijaya21
                - MQTT_HOST=host.docker.internal
                - MQTT_PORT=1883
                - MQTT_USERNAME=dashboard_user
                - MQTT_PASSWORD=PasswordDashboardYangKuat
            depends_on:
                - mysql

    queue-worker:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        image: laravel-custom-app
        container_name: monitoring_queue
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600
        networks:
            - laravel
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - TZ=Asia/Jakarta
            - APP_ENV=production
            - APP_DEBUG=false
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=wijayapl_monitoring
            - DB_USERNAME=wijayapl_monitoring
            - DB_PASSWORD=monitoring_wijaya21
            - MQTT_HOST=host.docker.internal
            - MQTT_PORT=1883
            - MQTT_USERNAME=dashboard_user
            - MQTT_PASSWORD=PasswordDashboardYangKuat
        depends_on:
            - mysql
    networks:
        laravel:
            driver: bridge

    volumes:
        mysql_data:
