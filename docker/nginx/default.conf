server {
    listen 80;
    server_name monitoring.wijayaplywoods.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name monitoring.wijayaplywoods.com;

    root /var/www/html/public;

    ssl_certificate /etc/letsencrypt/live/monitoring.wijayaplywoods.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.wijayaplywoods.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    charset utf-8;

    # ------------------------------------------------------------------
    # MQTT lewat WebSocket (dipakai halaman MQTT Inspector).
    # Browser terhubung ke:  wss://monitoring.wijayaplywoods.com/mqtt
    #
    # - "mosquitto" = nama service Mosquitto di docker-compose.yml
    #   (harus satu jaringan Docker dengan Nginx). 9001 = port WebSocket Mosquitto.
    # - Alamat dicari lewat variabel + resolver, jadi Nginx tetap bisa hidup
    #   walaupun kontainer Mosquitto sedang mati.
    # ------------------------------------------------------------------
    location = /mqtt {
        resolver 127.0.0.11 valid=30s;       # DNS bawaan Docker
        set $mqtt_upstream host.docker.internal:9001;
        proxy_pass http://$mqtt_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}