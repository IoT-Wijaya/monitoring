server {
    listen 80;
    server_name monitoring.wijayaplywoods.com;

    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    # Simpan log ke folder yang dibagikan dengan Vector
    error_log /var/log/nginx/error.log error;
    access_log /var/log/nginx/access.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
        try_files $uri =404;
    }

    location /fw/ {
        alias /var/www/firmware/;
        gzip off;
        autoindex off;
        add_header Cache-Control "no-store";
    }

    # MQTT lewat WebSocket (dipakai halaman MQTT Inspector).
    # Browser terhubung ke: wss://monitoring.wijayaplywoods.com/mqtt
    # walaupun kontainer Mosquitto sedang mati.
    # -----------------------------------------------------------------
    location = /mqtt {
        proxy_pass http://172.17.0.1:9001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}